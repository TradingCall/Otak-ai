<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GACOR HUNTER - Smart Trading Plan Engine</title>
    <style>
        :root { 
            --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --accent: #38bdf8; 
            --buy: #22c55e; --wait: #eab308; --watch: #0ea5e9; --skip: #ef4444; 
        }
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; line-height: 1.6; 
        }
        .container { max-width: 900px; margin: auto; }
        
        h1 { color: var(--accent); text-align: center; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .search-box { background: var(--panel); padding: 20px; border-radius: 6px; border: 1px solid #334155; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        
        input[type="text"] { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; font-family: inherit; font-size: 15px; border-radius: 4px; text-transform: uppercase; }
        input:focus { outline: none; border-color: var(--accent); }
        
        button { padding: 12px 25px; background: var(--accent); color: #0f172a; font-weight: bold; font-family: inherit; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #0284c7; color: white; }
        button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

        .broksum-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #0f172a; padding: 15px; border-radius: 4px; border: 1px solid #334155; }
        .broksum-title { grid-column: span 2; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .broksum-field label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 5px; }

        .terminal-box { background: var(--panel); border: 1px solid #334155; padding: 25px; border-radius: 6px; display: none; margin-top: 20px; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .terminal-header { border-bottom: 1px dashed #475569; padding-bottom: 10px; margin-bottom: 15px; color: var(--accent); font-weight: bold; }

        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #fff; font-size: 12px; }
        .BUY { background-color: var(--buy); } .WAIT { background-color: var(--wait); color: #000; } .WATCH { background-color: var(--watch); } .SKIP { background-color: var(--skip); }

        /* Tracker UI */
        .tracker-box { background: #0f172a; border: 1px solid #38bdf8; padding: 15px; border-radius: 4px; display: none; margin-top: 20px; color: #38bdf8; font-weight: bold; }
        .tracker-log { font-size: 13px; color: #94a3b8; margin-top: 10px; font-weight: normal; max-height: 100px; overflow-y: auto; }
        .tracker-log div { padding: 2px 0; border-bottom: 1px dashed #1e293b; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        
        .error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid #ef4444; padding: 15px; border-radius: 4px; display: none; margin-top: 15px; font-weight: bold; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 GACOR HUNTER</h1>
    <p class="subtitle">AI Price Action Engine — Auto Retry & Live Analysis</p>
    
    <div class="search-box">
        <div class="input-group">
            <input type="text" id="tickerInput" placeholder="Masukkan Ticker (Cth: BBCA, PANI)" onkeypress="if(event.key === 'Enter') startEngine()">
            <button id="scanBtn" onclick="startEngine()">SCAN TARGET</button>
        </div>

        <div class="broksum-container">
            <div class="broksum-title">💡 Broksum Flow (Opsional - Pisahkan dengan koma)</div>
            <div class="broksum-field">
                <label>Top 5 Net Buy Brokers:</label>
                <input type="text" id="topBuyInput" placeholder="Cth: BK, KZ, RX, AK, ZP">
            </div>
            <div class="broksum-field">
                <label>Top 5 Net Sell Brokers:</label>
                <input type="text" id="topSellInput" placeholder="Cth: YP, XL, KK, PD, CC">
            </div>
        </div>
    </div>
    
    <!-- AI Progress Tracker -->
    <div id="trackerBox" class="tracker-box">
        <div id="trackerMain">> ENGINE INITIALIZING<span class="cursor-blink">_</span></div>
        <div id="trackerLog" class="tracker-log"></div>
    </div>
    
    <div id="error" class="error"></div>
    <div id="resultBox" class="terminal-box"></div>
</div>

<script>
    // Utils
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const calcSMA = (data, window) => {
        if(data.length < window) return 0;
        let sum = 0; for(let i = data.length - window; i < data.length; i++) sum += data[i];
        return sum / window;
    };

    // UI Updates
    function updateLog(msg, isMain = false) {
        if(isMain) {
            document.getElementById("trackerMain").innerHTML = `> ${msg}<span class="cursor-blink">_</span>`;
        }
        let logDiv = document.getElementById("trackerLog");
        logDiv.innerHTML += `<div>[*] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight; // Auto scroll to bottom
    }

    async function fetchStockDataWithRetry(ticker) {
        const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1y`;
        
        // Daftar 3 server proxy agar kebal error
        const proxies = [
            `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`
        ];

        let maxRetries = 3; // Jika gagal, akan diulang 3x siklus (Total max 9 kali hit API)
        
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
            updateLog(`Memulai pencarian data (Percobaan ${attempt}/${maxRetries})...`, true);
            
            for (let i = 0; i < proxies.length; i++) {
                try {
                    updateLog(`Menghubungkan ke Server Proxy ${i+1}...`);
                    const res = await fetch(proxies[i]);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    
                    let data;
                    if (i === 0) {
                        const proxyData = await res.json();
                        data = JSON.parse(proxyData.contents);
                    } else {
                        data = await res.json();
                    }
                    
                    if (data && data.chart && data.chart.result && data.chart.result.length > 0) {
                        updateLog(`[SUCCESS] Data ${ticker} berhasil diunduh dari Proxy ${i+1}.`);
                        await sleep(500); // Jeda agar UI terlihat halus
                        return data;
                    }
                } catch (e) {
                    updateLog(`[GAGAL] Proxy ${i+1} menolak koneksi. Mencari jalur lain...`);
                }
            }

            if (attempt < maxRetries) {
                updateLog(`[WARNING] Semua proxy sibuk. Menunggu 2 detik untuk Request Ulang...`, true);
                await sleep(2000); // Tunggu 2 detik sebelum auto-retry
            }
        }
        throw new Error("Gagal mengambil data dari server. Market Data API sedang mengalami gangguan / rate limit. Coba lagi dalam 1 menit.");
    }

    // MAIN ENGINE
    async function startEngine() {
        let ticker = document.getElementById("tickerInput").value.trim().toUpperCase();
        if (!ticker) return;

        // Reset UI
        document.getElementById("scanBtn").disabled = true;
        document.getElementById("resultBox").style.display = "none";
        document.getElementById("error").style.display = "none";
        document.getElementById("trackerBox").style.display = "block";
        document.getElementById("trackerLog").innerHTML = "";
        
        if (!ticker.endsWith('.JK')) ticker += '.JK';
        const cleanTicker = ticker.replace('.JK', '');

        const rawBuyBrokers = document.getElementById("topBuyInput").value.trim().toUpperCase().split(',').map(b => b.trim()).filter(b => b);
        const rawSellBrokers = document.getElementById("topSellInput").value.trim().toUpperCase().split(',').map(b => b.trim()).filter(b => b);

        try {
            // FASE 1: FETCH DATA (WITH AUTO-RETRY)
            const data = await fetchStockDataWithRetry(ticker);

            const rawQuotes = data.chart.result[0].indicators.quote[0];
            let closes = [], highs = [], lows = [], volumes = [];
            
            for(let i = 0; i < rawQuotes.close.length; i++) {
                if(rawQuotes.close[i] !== null && rawQuotes.volume[i] !== null) {
                    closes.push(rawQuotes.close[i]);
                    highs.push(rawQuotes.high[i]);
                    lows.push(rawQuotes.low[i]);
                    volumes.push(rawQuotes.volume[i]);
                }
            }

            if (closes.length < 50) throw new Error("Data chart tidak cukup untuk analisa struktur. Saham mungkin baru IPO.");

            // FASE 2: ANALISIS INDIKATOR & VOLUME
            updateLog("Mengekstrak pergerakan Harga & Volume...", true);
            await sleep(700);
            const currClose = closes[closes.length - 1];
            const ma20 = calcSMA(closes, 20);
            const ma50 = calcSMA(closes, 50);

            // FASE 3: STRUKTUR & FIBONACCI
            updateLog("Menghitung Dynamic Support, Resistance, dan Level Fibonacci...", true);
            await sleep(800);
            const recentHighs = highs.slice(-60);
            const recentLows = lows.slice(-60);
            const swingHigh = Math.max(...recentHighs); 
            const swingLow = Math.min(...recentLows);
            const fibDiff = swingHigh - swingLow;

            const fib500 = swingHigh - (0.500 * fibDiff);
            const fib618 = swingHigh - (0.618 * fibDiff);
            const high52w = Math.max(...highs);

            // FASE 4: MERUMUSKAN TRADING PLAN (SMART LOGIC)
            updateLog("Merumuskan Entry Level & Manajemen Risiko (SL/TP)...", true);
            await sleep(800);

            let buyZoneLow, buyZoneHigh, buyReason;
            if (currClose >= swingHigh * 0.98) {
                // Dekat puncak -> Retest Support / Breakout RBS
                buyZoneLow = Math.round(Math.max(ma20, swingHigh * 0.95));
                buyZoneHigh = Math.round(swingHigh * 0.98);
                buyReason = "Retest Breakout Level / RBS";
            } else {
                // Sedang Pullback -> Area Fibo 0.5 - 0.618 atau MA50
                buyZoneLow = Math.round(Math.max(fib618, ma50));
                buyZoneHigh = Math.round(fib500);
                buyReason = "Area Pantulan Fibo 0.5-0.618 & Dynamic Support";
            }

            let structuralSL = Math.round(Math.min(swingLow * 0.98, ma50 * 0.98));
            let maxLossAllowed = Math.round(buyZoneHigh * 0.94); // Max toleransi -6%
            
            let clLevel, clReason;
            if (structuralSL < maxLossAllowed) {
                clLevel = maxLossAllowed;
                clReason = "Max Tolerance Risk (>-6%) tercapai";
            } else {
                clLevel = structuralSL;
                clReason = "Patah struktur / Jebol Support Kuat (Downtrend Terkonfirmasi)";
            }

            let tp1 = Math.round(swingHigh);
            if (tp1 <= buyZoneHigh * 1.02) tp1 = Math.round(buyZoneHigh * 1.05); // Jika TP kerendahan
            let tp2 = Math.round(Math.max(high52w, swingHigh + (fibDiff * 0.272)));
            let tp3 = Math.round(swingHigh + (fibDiff * 0.618));

            let risk = Math.max(1, buyZoneHigh - clLevel);
            let reward = Math.max(1, tp1 - buyZoneHigh);
            let rrRatio = reward / risk;

            // FASE 5: FINAL DECISION
            updateLog("Menggabungkan data Broker Flow & Menarik Kesimpulan...", true);
            await sleep(900);

            let finalStatus = (rrRatio >= 1.5 && currClose >= ma50) ? (currClose <= buyZoneHigh * 1.02 ? "BUY" : "WAIT PULLBACK") : "SKIP (R:R BURUK / DOWNTREND)";
            let confClass = finalStatus.includes("BUY") ? "BUY" : (finalStatus.includes("WAIT") ? "WAIT" : "SKIP");

            // RENDER HASIL AKHIR
            document.getElementById("trackerBox").style.display = "none";
            document.getElementById("scanBtn").disabled = false;
            let out = document.getElementById("resultBox");
            out.style.display = "block";

            let topBuyText = rawBuyBrokers.length > 0 ? rawBuyBrokers.join(', ') : "N/A (Sistem Proxy)";
            let topSellText = rawSellBrokers.length > 0 ? rawSellBrokers.join(', ') : "N/A (Sistem Proxy)";

            let html = `
<div class="terminal-header">>>> GACOR HUNTER: LOGICAL TRADING PLAN GENERATED</div>
TICKER: <b>$${cleanTicker}</b>
CURRENT PRICE: Rp ${currClose.toLocaleString('id-ID')}
MARKET STRUCTURE: ${currClose > ma20 ? 'Bullish / Uptrend' : 'Konsolidasi / Pullback'}

BROKSUM DATA (IF PROVIDED):
• TOP BUY : [ ${topBuyText} ]
• TOP SELL: [ ${topSellText} ]

==================================================
TRADING PLAN (PRICE ACTION & FIBO BASED)
==================================================
🛒 BUY ZONE   : Rp ${buyZoneLow.toLocaleString('id-ID')} - Rp ${buyZoneHigh.toLocaleString('id-ID')}
📝 LOGIKA ENTRY: Harga memasuki ${buyReason}. Area ini adalah area demand dengan probabilitas pantulan tinggi.

⚠️ STOP LOSS  : Rp ${clLevel.toLocaleString('id-ID')}
📝 LOGIKA CL  : ${clReason}. Jika harga menembus level ini, tren berbalik menjadi bearish. Segera amankan modal.

🎯 TAKE PROFIT:
- TP 1 (Realistic) : Rp ${tp1.toLocaleString('id-ID')} (Resistance / Previous High)
- TP 2 (Momentum)  : Rp ${tp2.toLocaleString('id-ID')} (Fibonacci Ext 1.272 / High 52-W)
- TP 3 (Max Trend) : Rp ${tp3.toLocaleString('id-ID')} (Fibonacci Ext 1.618)

⚖️ RISK/REWARD RATIO: 1 : ${rrRatio.toFixed(1)}
STATUS: <span class="status-badge ${confClass}">${finalStatus}</span>
`;
            out.innerHTML = html;

        } catch (error) {
            document.getElementById("trackerBox").style.display = "none";
            document.getElementById("scanBtn").disabled = false;
            
            let err = document.getElementById("error");
            err.innerHTML = `[SYSTEM FAILURE] ${error.message}`;
            err.style.display = "block";
        }
    }
</script>

</body>
</html>
